press_custom_button:
  fields:
    button_id:
      required: true
      selector:
        number:
          min: 1
          max: 99999999
          mode: box
run_macro:
  fields:
    macro_id:
      required: true
      selector:
        number:
          min: 1
          max: 100000
          mode: box
send_command:
  fields:
    item_id:
      required: true
      selector:
        number:
          min: 1
          max: 99999999
          mode: box
    command:
      required: true
      selector:
        text:
    params:
      required: false
      selector:
        object:
